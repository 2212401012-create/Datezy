        options.min !== undefined ? `min="${esc(options.min)}"` : "",
        options.max !== undefined ? `max="${esc(options.max)}"` : "",
        options.minlength ? `minlength="${esc(options.minlength)}"` : "",
        options.maxlength ? `maxlength="${esc(options.maxlength)}"` : "",
        options.placeholder ? `placeholder="${esc(options.placeholder)}"` : "",
        options.accept ? `accept="${esc(options.accept)}"` : "",
        options.autocomplete ? `autocomplete="${esc(options.autocomplete)}"` : "",
        options.readonly ? "readonly" : ""
      ].join(" ");

      let control;

      if (type === "textarea") {
        control = `<textarea id="${id}" name="${esc(name)}" ${attrs}>${esc(value)}</textarea>`;
      } else if (type === "select") {
        control = `<select id="${id}" name="${esc(name)}" ${attrs}>${

            const v = Array.isArray(item) ? item[0] : item;

            return `<option value="${esc(v)}" ${String(value) === String(v) ? "selected" : ""}>${esc(text)}</option>`;

          type !== "file" ? `value="${esc(value)}"` : ""
        } ${attrs}>`;
      }

      return `<div class="field">

    async function readAll(table, options = {}) {
      const result = [];
      for (let from = 0; ; from += 500) {

        if (options.own) query = query.eq(options.key || "user_id", options.own);
        if (options.order !== false) query = query.order("created_at", { ascending: false });
        const { data, error } = await query;
        if (error) throw error;
        result.push(...(data || []));
        if (!data || data.length < 500) break;
      }
      return result;
    }

    async function prepareImage(file, maxSide = 1600, quality = .9) {
      if (!file || !file.size) throw new Error("Choose an image.");
      if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
        throw new Error("Choose JPEG, PNG, or WebP.");
      }
      if (file.size > 5242880) throw new Error("Images must be no larger than 5 MB.");

      const bitmap = await createImageBitmap(file);
      if (bitmap.width > 16000 || bitmap.height > 16000) {
        bitmap.close();
        throw new Error("Image dimensions are too large.");
      }

      const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close();

      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/webp", quality));
      if (!blob || blob.size > 5242880) throw new Error("Crop the image and try again; processed images must fit within 5 MB.");
      return blob;
    }

    function filteredUsers(rows) {
      const f = S.adminFilter;
      return rows.filter(p =>
        (!f.gender || p.gender === f.gender) &&
        (!f.status || p.status === f.status) &&
        `${p.full_name} ${p.display_name} ${p.email}`.toLowerCase().includes((f.search || "").toLowerCase()) &&
        `${p.district} ${p.area}`.toLowerCase().includes((f.area || "").toLowerCase()) &&
        (!f.date || p.created_at.slice(0, 10) === f.date)
      );
    }

          <h3>Privacy requests</h3><p>Request deletion in account settings or contact support for access/correction requests.</p>
        </div>`;
    }

    function faqPage() {
      const entries = [
        ["Who can join Datezy?", "Adults aged 18 and above. The form and database validate the age rule. Approval is not proof of identity."],
        ["How much is registration?", S.settings.fees_enabled ? `Current proposed fees: men ${money(S.settings.male_fee)}, women ${money(S.settings.female_fee)}. Your actual fee is snapshotted when your account is created.` : "Registration fees are currently disabled. Profile approval is still required."],
        ["How is payment verified?", "You send funds separately, upload a screenshot and submit the transaction ID. An administrator checks real incoming funds before Verify/Reject. A screenshot alone is not confirmation."],
        ["Does payment guarantee a date?", "No. Availability, affection, consent and invitation acceptance are never purchased."],
        ["Why is my profile pending after payment?", "Payment verification and profile approval are separate."],
        ["Are my email and phone public?", "No. Private contact details, exact birth date, payment evidence and internal moderation notes are not included in public profiles."],
        ["When do referrals qualify?", "After unique eligible adult registration, verified required payment, approved profile and documented fraud review. Rewards are not guaranteed."],
        ["Can I block, report or delete my account?", "Yes. Block/report are available on discovery cards. Deletion requests hide your listing immediately, then support completes secure removal."],
        ["Is paid companionship available?", "No. Host booking and paid companionship are disabled."],
        ["Can I change the theme?", "Use Theme to change colors in this browser. Edit CONFIG.theme in this HTML to change default colors for all visitors."],
        ["Does the Google Forms version have built-in login?", "No. Google Forms starter mode only collects form responses. It does not create Datezy accounts, dashboards or verified rewards."]
      ];
      return `${head("Questions? We've got you.", "", "A little clarity")}
        <div class="panel">${entries.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}</div>
        ${link("Contact support →", "/contact")}`;
    }

    function parseRoute() {
      const raw = location.hash.slice(1) || "/";
      const [path, query = ""] = raw.split("?");
      return { path: path.startsWith("/") ? path : `/${path}`, params: new URLSearchParams(query) };
    }

    async function render() {
      const id = ++S.renderId;
      const { path, params } = parseRoute();
      chrome();
      $("#app").innerHTML = `<div class="container page">${empty("Loading…")}</div>`;

      try {
        let content;
        let narrow = false;
        let auth = false;

        switch (path) {
          case "/":
            content = homePage();
            break;
          case "/how-it-works":
            content = howPage();
            break;
          case "/register":
            content = registrationPage(params); narrow = true;
            break;
          case "/login":
            content = loginPage(); auth = true;
            break;
          case "/admin/login":
            content = loginPage(true); auth = true;
            break;
          case "/reset-password":
            content = passwordPage(); auth = true;
            break;
          case "/dashboard":
            content = await dashboardPage();
            break;
          case "/edit-profile":
            content = await editPage(); narrow = true;
            break;
          case "/referrals":
            content = await referralsPage();
            break;
          case "/payment":
            content = await paymentPage(); narrow = true;
            break;
          case "/explore":
            content = await explorePage();
            break;
          case "/admin":
            content = await adminPage();
            break;
          case "/about":
            content = aboutPage(); narrow = true;
            break;
          case "/contact":
            content = contactPage(); narrow = true;
            break;
          case "/terms":
          case "/privacy":
          case "/community":
            content = policyPage(path.slice(1)); narrow = true;
            break;
          case "/faq":
            content = faqPage(); narrow = true;
            break;
          default:
            content = `${head("A little off course.")}<p>This page does not exist.</p>${link("Back home", "/", "button primary")}`;
        }

        if (id !== S.renderId) return;
        $("#app").innerHTML = path === "/" ? content : `<div class="container page ${narrow ? "narrow" : ""} ${auth ? "auth" : ""}">${content}</div>`;
        document.title = path === "/" ? "Datezy — Quick Dating Bangladesh" : `${path.slice(1).replaceAll("-", " ")} — Datezy`;
        window.scrollTo(0, 0);
        hydratePhotos(id);
      } catch (error) {
        if (id !== S.renderId) return;
        $("#app").innerHTML = `<div class="container page">${notice(errorText(error), "error")}${button("Retry", "refresh")}</div>`;
      }
    }

    function showDialog(title, html) {
      const dialog = $("#dialog");
      dialog.innerHTML = `<div class="dialog-top"><h2>${esc(title)}</h2>${button("✕", "close-dialog", "", "small")}</div>${html}`;
      dialog.showModal();
    }

    function applyTheme(theme) {
      for (const key of Object.keys(CONFIG.theme)) {
        if (/^#[0-9a-f]{6}$/i.test(theme[key] || "")) {
          document.documentElement.style.setProperty(`--${key}`, theme[key]);
        }
      }
    }

    function themeDialog() {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem("datezy-theme") || "{}"); } catch {}
      const theme = { ...CONFIG.theme, ...saved };
      showDialog("Theme settings", `<form data-form="theme">
        ${notice("These choices apply only in this browser. Edit CONFIG.theme in the HTML for the default theme shown to all visitors. Keep text/background contrast readable.")}
        <div class="form-grid">${Object.keys(CONFIG.theme).map(key => field(key[0].toUpperCase() + key.slice(1), key, theme[key], "color")).join("")}</div>
        <div class="actions"><button class="button primary" type="submit">Save theme</button>${button("Reset default", "reset-theme")}</div>
      </form>`);
    }

    function inviteDialog(id) {
      const person = S.people.find(p => p.id === id);
      if (!person) throw new Error("Profile is unavailable.");
      showDialog(`Meet ${person.display_name}?`, `<form data-form="invite" data-id="${esc(id)}">
        <p>An invitation is not an obligation. Choose a public place.</p>
        ${field("Today, tomorrow, or a future date", "date", today(), "date", { required: true, min: today() })}
        <div class="form-grid">
          ${field("Duration", "duration", person.duration || 60, "select", { items: DURATIONS.map(n => [n, `${n} minutes`]) })}
          ${field("Public meeting place", "location", person.location_type || "Cafe", "select", { items: LOCATIONS })}
        </div>
        ${field("Activity / shared interest", "activity", "", "text", { required: true, minlength: 2, maxlength: 150 })}
        ${field("Availability, Bangladesh time", "availability", "", "text", { required: true, minlength: 2, maxlength: 150, placeholder: "e.g. 4–6 PM" })}
        ${notice("No payment guarantees acceptance or consent. The recipient may freely decline.")}
        <button class="button primary full" type="submit">Send invitation</button>
      </form>`);
    }

    async function perform(action, id) {
      if (action === "menu") {
        $("#nav-links").classList.toggle("open");
        return;
      }

      if (action === "theme") return themeDialog();

      if (action === "close-dialog") {
        $("#dialog").close();
        return;
      }

      if (action === "reset-theme") {
        localStorage.removeItem("datezy-theme");
        applyTheme(CONFIG.theme);
        $("#dialog").close();
        return;
      }

      if (action === "refresh") return render();

      if (action === "admin-tab") {
        S.adminTab = id;
        return render();
      }

      if (action === "copy-referral") {
        const input = $("#referral-link");
        try {
          await navigator.clipboard.writeText(input.value);
          notify("Referral link copied.", "success");
        } catch {
          input.select();
          notify("Select the link and copy it with Ctrl+C.");
        }
        return;
      }

      if (action === "forgot") {
        const email = $("#field-email")?.value?.trim();
        if (!email) throw new Error("Enter your email address first.");
        const { error } = await S.db.auth.resetPasswordForEmail(email, {
          redirectTo: authRedirect("reset-password")
        });
        if (error) throw error;
        notify("If an account exists, a recovery link will be emailed. Check your email setup if it does not arrive.");
        return;
      }

      if (action === "logout") {
        const { error } = await S.db.auth.signOut();
        if (error) throw error;
        await loadAccount(null);
        location.hash = "/login";
        await render();
        return;
      }

      if (action === "delete-account") {
        if (!confirm("Request deletion? Your public listing will be hidden immediately. Support will complete secure removal.")) return;
        await rpc("request_account_deletion");
        await loadAccount(S.user);
        await render();
        notify("Deletion requested. Your listing is hidden.");
        return;
      }

      if (action === "invite") return inviteDialog(id);

      if (action === "report") {
        const reason = prompt("Explain your concern (at least 5 characters). This report is private to moderators.");
        if (reason === null) return;
        if (reason.trim().length < 5) throw new Error("Provide at least 5 characters.");
        await rpc("report_profile", { p_id: id, p_reason: reason });
        notify("Report sent to moderators.", "success");
        return;
      }

      if (action === "block" || action === "unblock") {
        if (action === "block" && !confirm("Block this profile and cancel active invitations?")) return;
        await rpc("block_profile", { p_id: id, p_block: action === "block" });
        await render();
        notify(action === "block" ? "Profile blocked." : "Profile unblocked.");
        return;
      }

      if (action.startsWith("date-")) {
        await rpc("respond_date_request", { p_id: id, p_action: action.slice(5) });
        await render();
        notify("Invitation updated.", "success");
        return;
      }

      if (action === "receipt") {
        const query = await S.db.from("payments").select("receipt_path").eq("id", id).single();
        if (query.error) throw query.error;
        if (!query.data?.receipt_path) throw new Error("Screenshot is unavailable.");

        const container = $(`#receipt-${id}`);
        if (container.innerHTML) {
          container.innerHTML = "";
          return;
        }

        const url = await signedImage("payment-receipts", query.data.receipt_path, 300);
        container.innerHTML = `
          <img src="${esc(url)}" alt="Private submitted payment evidence">
          <p><a class="text-link" href="${esc(url)}" target="_blank" rel="noreferrer">Open full screenshot ↗</a></p>
          <p class="small-text">Private link expires after five minutes. A screenshot alone is not proof that funds arrived.</p>`;
        return;
      }

      if (!S.admin) throw new Error("Server-verified administrator access is required.");

      if (action === "profile-note") {
        const note = prompt("Internal moderation note:");
        if (!note) return;
        await rpc("admin_add_note", { p_id: id, p_note: note });
      } else if (action.startsWith("profile-")) {
        const note = prompt("Internal moderation note (optional):", "");
        if (note === null) return;
        await rpc("admin_review_profile", {
          p_id: id,
          p_status: action.slice(8),
          p_note: note
        });
      } else if (action.startsWith("payment-")) {
        const status = action.slice(8);
        const note = prompt(
          status === "verified"
            ? "Check actual incoming funds independently before proceeding. Record your verification note:"
            : "Record the review/refund note:",
          ""
        );
        if (note === null) return;

        let amount = 0;
        let reference = "";

        if (status === "refunded") {
          const payment = S.adminData.payments.find(p => p.id === id);
          amount = Number(prompt("Amount actually refunded in BDT:", payment?.amount || ""));
          reference = prompt("Actual refund transaction reference:", "") || "";
          if (!amount || reference.trim().length < 5) throw new Error("A real refund amount and reference are required.");
        }

        await rpc("admin_review_payment", {
          p_id: id,
          p_action: status,
          p_note: note,
          p_refund_amount: amount,
          p_refund_reference: reference
        });
      } else if (action.startsWith("reward-")) {
        const status = action.slice(7);
        let checked = false;
        let note = "";
        let reference = "";

        if (status === "approved") {
          checked = confirm("Have you independently checked contact uniqueness, eligibility, suspicious signups and referral abuse?");
          if (!checked) return;
          note = prompt("Document the fraud-check result (at least 5 characters):", "") || "";
          if (note.trim().length < 5) throw new Error("Document the fraud review.");
        } else if (status === "paid") {
          reference = prompt("Enter the actual payout reference. Do not mark paid before sending money:", "") || "";
          if (reference.trim().length < 5) throw new Error("A real payout reference is required.");
        } else {
          const value = prompt("Reason for rejection:", "");
          if (value === null) return;
          note = value;
        }

        await rpc("admin_review_reward", {
          p_id: id,
          p_action: status,
          p_fraud_checked: checked,
          p_note: note,
          p_payout_reference: reference
        });
      } else if (action === "resolve-report") {
        const note = prompt("Resolution note:", "");
        if (note === null) return;
        await rpc("admin_resolve_report", { p_id: id, p_note: note });
      } else {
        return;
      }

      await render();
      notify("Action saved and recorded in the admin audit log.", "success");
    }

    async function submitForm(form) {
      const data = new FormData(form);
      const get = name => String(data.get(name) || "").trim();
      const kind = form.dataset.form;

      if (kind === "theme") {
        const theme = {};
        for (const key of Object.keys(CONFIG.theme)) theme[key] = get(key);
        localStorage.setItem("datezy-theme", JSON.stringify(theme));
        applyTheme(theme);
        $("#dialog").close();
        notify("Theme saved for this browser.", "success");
        return;
      }

      if (!S.db) throw new Error("Supabase is not configured.");

      if (kind === "register") {
        const email = get("email").toLowerCase();
        const phone = get("phone");
        const years = age(get("birth_date"));
        const password = String(data.get("password") || "");

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error("Enter a valid email.");
        if (!/^\+8801[3-9][0-9]{8}$/.test(phone)) throw new Error("Use a valid Bangladesh number, e.g. +8801712345678.");
        if (!Number.isFinite(years) || years < 18 || years > 120) throw new Error("You must be at least 18 years old with a valid date of birth.");
        if (password.length < 12) throw new Error("Use at least 12 password characters.");
        if (!data.has("terms_accepted") || !data.has("adult_confirmed")) throw new Error("Accept the policies and confirm you are 18+.");

        const metadata = {
          full_name: get("full_name"),
          display_name: get("display_name"),
          phone,
          birth_date: get("birth_date"),
          gender: get("gender"),
          preferred_gender: get("preferred_gender"),
          district: get("district"),
          area: get("area"),
          bio: get("bio"),
          interests: interests(get("interests")),
          duration: Number(get("duration")),
          location_type: get("location_type"),
          referral_code: get("referral_code").toUpperCase(),
          listing_consent: data.has("listing_consent"),
          terms_accepted: true,
          adult_confirmed: true
        };

        const result = await S.db.auth.signUp({
          email,
          password,
          options: {
            data: metadata,
            emailRedirectTo: authRedirect("dashboard")
          }
        });

        if (result.error) throw result.error;

        if (result.data.session) {
          await loadAccount(result.data.session.user);
          location.hash = "/dashboard";
          await render();
          notify("Account created. Payment verification and profile approval remain separate.");
        } else {
          $("#app").innerHTML = `<div class="container page narrow">${head("Check your email.")}<div class="panel">${notice("Confirm your email to continue. If you already have an account, log in or reset your password. Supabase public email delivery requires appropriate SMTP setup.")}${link("Continue to login", "/login", "button primary")}</div></div>`;
        }
        return;
      }

      if (kind === "login" || kind === "admin-login") {
        const result = await S.db.auth.signInWithPassword({
          email: get("email"),
          password: String(data.get("password") || "")
        });
        if (result.error) throw result.error;
        await loadAccount(result.data.user);
        location.hash = kind === "admin-login" ? "/admin" : "/dashboard";
        await render();
        return;
      }

      if (kind === "password") {
        const password = String(data.get("password") || "");
        if (password.length < 12) throw new Error("Use at least 12 characters.");
        const { error } = await S.db.auth.updateUser({ password });
        if (error) throw error;
        form.reset();
        notify("Password updated.", "success");
        return;
      }

      if (kind === "payment") {
        const file = data.get("receipt");
        const blob = await prepareImage(file, 2400, 1);
        const path = `${S.user.id}/${crypto.randomUUID()}.webp`;
        let submitted = false;

        try {
          const upload = await S.db.storage.from("payment-receipts").upload(path, blob, {
            contentType: "image/webp",
            upsert: false
          });
          if (upload.error) throw upload.error;

          await rpc("submit_payment", {
            p_method: get("method"),
            p_transaction: get("transaction"),
            p_receipt_path: path
          });

          submitted = true;
          await render();
          notify("Screenshot and reference submitted. Payment is Pending Verification, not yet successful.");
        } catch (error) {
          if (!submitted) {
            // Storage policy refuses deletion if the server already attached it.
            await S.db.storage.from("payment-receipts").remove([path]);
          }
          throw error;
        }
        return;
      }

      if (kind === "profile") {
        const p = S.profile;
        let path = data.has("remove_photo") ? null : p.photo_path;
        const file = data.get("photo");
        let newPath = "";

        if (file?.size) {
          const blob = await prepareImage(file);
          newPath = `${S.user.id}/${crypto.randomUUID()}.webp`;
          const upload = await S.db.storage.from("profile-photos").upload(newPath, blob, {
            contentType: "image/webp",
            upsert: false
          });
          if (upload.error) throw upload.error;
          path = newPath;
        }

        const patch = {
          display_name: get("display_name"),
          district: get("district"),
          area: get("area"),
          bio: get("bio"),
          interests: interests(get("interests")),
          preferred_gender: get("preferred_gender"),
          duration: Number(get("duration")),
          location_type: get("location_type"),
          listing_consent: data.has("listing_consent"),
          photo_path: path
        };

        const result = await S.db.from("profiles").update(patch).eq("id", S.user.id).select("id");
        if (result.error) throw result.error;
        if (!result.data?.length) throw new Error("This profile cannot currently be edited.");

        if (p.photo_path && p.photo_path !== path) {
          await S.db.storage.from("profile-photos").remove([p.photo_path]);
        }

        await loadAccount(S.user);
        await render();
        notify("Profile saved. Public detail changes require a new admin review.", "success");
        return;
      }

      if (kind === "explore") {
        const min = Number(get("min_age"));
        const max = Number(get("max_age"));
        if (max < min) throw new Error("Maximum age must be at least the minimum age.");

        S.people = await rpc("discover_profiles", {
          p_gender: get("gender"),
          p_min_age: min,
          p_max_age: max,
          p_district: get("district"),
          p_interest: get("interest"),
          p_duration: Number(get("duration")),
          p_offset: 0
        });

        $("#people-results").innerHTML = peopleHTML(S.people);
        hydratePhotos(S.renderId);
        return;
      }

      if (kind === "invite") {
        await rpc("send_date_request", {
          p_recipient: form.dataset.id,
          p_date: get("date"),
          p_duration: Number(get("duration")),
          p_location: get("location"),
          p_activity: get("activity"),
          p_availability: get("availability")
        });
        $("#dialog").close();
        notify("Invitation sent. The recipient may freely accept or decline.");
        return;
      }

      if (!S.admin) throw new Error("Administrator access is required.");

      if (kind === "admin-filter") {
        S.adminFilter = Object.fromEntries(data.entries());
        await render();
        return;
      }

      if (kind === "settings") {
        const settings = {
          ...S.settings,
          site_name: get("site_name"),
          logo_url: get("logo_url"),
          male_fee: Number(get("male_fee")),
          female_fee: Number(get("female_fee")),
          referral_reward: Number(get("referral_reward")),
          fees_enabled: data.has("fees_enabled"),
          support_contact: get("support_contact"),
          payment_methods: JSON.parse(get("payment_methods") || "[]"),
          payment_instructions: get("payment_instructions"),
          refund_policy: get("refund_policy"),
          referral_terms: get("referral_terms"),
          approval_requirements: get("approval_requirements"),
          terms: get("terms"),
          privacy: get("privacy"),
          community: get("community")
        };

        await rpc("admin_update_settings", { p_settings: settings });
        await loadSettings();
        await render();
        notify("Settings saved. New fees/rewards apply to future registrations.", "success");
      }
    }

    document.addEventListener("click", async event => {
      const target = event.target.closest("button[data-action]");
      if (!target) return;
      event.preventDefault();
      const oldDisabled = target.disabled;
      target.disabled = true;
      try {
        await perform(target.dataset.action, target.dataset.id || "");
      } catch (error) {
        notify(errorText(error), "error");
      } finally {
        if (target.isConnected) target.disabled = oldDisabled;
      }
    });

    document.addEventListener("submit", async event => {
      const form = event.target.closest("form[data-form]");
      if (!form) return;
      event.preventDefault();
      const submit = $("button[type=submit]", form);
      const originalText = submit?.textContent;

      if (submit) {
        submit.disabled = true;
        submit.textContent = "Please wait…";
      }

      try {
        await submitForm(form);
      } catch (error) {
        notify(errorText(error), "error");
      } finally {
        if (submit?.isConnected) {
          submit.disabled = false;
          submit.textContent = originalText;
        }
      }
    });

    $("#skip-button").addEventListener("click", () => $("#app").focus());
    $("#dialog").addEventListener("click", event => {
      if (event.target === $("#dialog")) $("#dialog").close();
    });
    window.addEventListener("hashchange", () => {
      notify("");
      render();
    });

    async function initialize() {
      let saved = {};
      try { saved = JSON.parse(localStorage.getItem("datezy-theme") || "{}"); } catch {}
      applyTheme({ ...CONFIG.theme, ...saved });

      const validUrl = /^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(CONFIG.supabaseUrl);
      const validKey = CONFIG.supabaseKey.length > 30 && !/YOUR_|PLACEHOLDER/i.test(CONFIG.supabaseKey);

      if (validUrl && validKey) {
        try {
          if (CONFIG.supabaseKey.startsWith("sb_secret_")) {
            throw new Error("A secret key must never be used in browser HTML. Replace it with the Publishable/Anon key.");
          }

          if (CONFIG.supabaseKey.split(".").length === 3) {
            try {
              const payload = JSON.parse(atob(CONFIG.supabaseKey.split(".")[1].replaceAll("-", "+").replaceAll("_", "/")));
              if (payload.role === "service_role") throw new Error("SERVICE_ROLE_FORBIDDEN");
            } catch (error) {
              if (error.message === "SERVICE_ROLE_FORBIDDEN") {
                throw new Error("Remove the service-role key from this HTML immediately. Use a browser-safe Publishable/Anon key.");
              }
            }
          }

          const module = await import("https://esm.sh/@supabase/supabase-js@2?bundle");
          S.db = module.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, {
            auth: {
              persistSession: true,
              autoRefreshToken: true,
              detectSessionInUrl: true
            }
          });

          const desiredView = new URLSearchParams(location.search).get("datezy_view");
          const session = await S.db.auth.getSession();
          if (session.error) throw session.error;

          await loadSettings();
          await loadAccount(session.data.session?.user || null);

          if (["dashboard", "reset-password"].includes(desiredView)) {
            const query = new URLSearchParams(location.search);
            query.delete("datezy_view");
            history.replaceState(null, "", location.pathname + (
              query.toString() ? "?" + query.toString() : ""
            ) + "#/" + desiredView);
          }

          S.db.auth.onAuthStateChange((_event, session) => {
            // Defer Supabase calls to avoid an Auth callback lock/deadlock.
            setTimeout(async () => {
              try {
                await loadAccount(session?.user || null);
                await render();
              } catch (error) {
                notify(errorText(error), "error");
              }
            }, 0);
          });
        } catch (error) {
          S.initError = errorText(error);
          if (!S.settings?.id) S.settings = { ...DEFAULT_SETTINGS };
          notify(S.initError, "error");
        }
      }

      await render();
    }

    initialize();
  </script>
</body>
</html>
